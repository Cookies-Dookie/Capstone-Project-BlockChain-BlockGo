name: TDD Full-Stack CI

on:
  push:
    branches:
      - staging
      - testing

  pull_request:
    branches:
      - staging
      - testing

  workflow_dispatch:
    inputs:
      run_full_smoke:
        description: "Run full-stack smoke test using Docker Postgres and middleware integration tests"
        required: false
        default: "yes"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

# Prevent duplicate CI runs for the same branch/commit.
concurrency:
  group: tdd-full-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# UNIT TESTS
# ============================================================

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ======================================================
      # DETECT PROJECTS
      # ======================================================

      - name: Detect repository components
        id: repo
        shell: bash
        run: |
          echo "========================================="
          echo "Detecting BlockGo repository components"
          echo "========================================="

          # ---------------------------
          # Go
          # ---------------------------

          if [ -f "./chaincode/go.mod" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"

            GO_REQUIRED="$(awk '/^go / {print $2; exit}' ./chaincode/go.mod)"

            echo "Detected Go requirement: $GO_REQUIRED"
            echo "go_required=$GO_REQUIRED" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "No chaincode/go.mod found."
          fi


          # ---------------------------
          # .NET
          # ---------------------------

          if [ -d "./client-app" ] && \
             find ./client-app -type f \( -name "*.csproj" -o -name "*.sln" \) \
             -print -quit | grep -q .; then

            echo "has_dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dotnet=false" >> "$GITHUB_OUTPUT"
            echo "No .NET project detected."
          fi

          if [ -f "./global.json" ]; then
            echo "has_global_json=true" >> "$GITHUB_OUTPUT"

            DOTNET_REQUIRED="$(python3 - <<'PY'
          import json
          with open("global.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          print(data.get("sdk", {}).get("version", "unknown"))
          PY
          )"

            echo "Detected .NET SDK requirement: $DOTNET_REQUIRED"
            echo "dotnet_required=$DOTNET_REQUIRED" >> "$GITHUB_OUTPUT"
          else
            echo "has_global_json=false" >> "$GITHUB_OUTPUT"
            echo "No global.json found."
          fi


          # ---------------------------
          # Node
          # ---------------------------

          HAS_NODE=false

          if [ -f "./middleware/package.json" ]; then
            HAS_NODE=true
          fi

          if [ -f "./frontend/package.json" ]; then
            HAS_NODE=true
          fi

          echo "has_node=$HAS_NODE" >> "$GITHUB_OUTPUT"


          # Default to Node 20 because that is what the
          # application Dockerfiles use.
          NODE_VERSION="20"

          if [ -f "./middleware/Dockerfile" ]; then
            DETECTED_NODE="$(
              grep -m1 -E '^FROM node:' ./middleware/Dockerfile \
              | sed -E 's/^FROM node:([^ -]+).*/\1/' \
              | cut -d'-' -f1 \
              || true
            )"

            if [ -n "$DETECTED_NODE" ]; then
              NODE_VERSION="$DETECTED_NODE"
            fi
          elif [ -f "./frontend/Dockerfile" ]; then
            DETECTED_NODE="$(
              grep -m1 -E '^FROM node:' ./frontend/Dockerfile \
              | sed -E 's/^FROM node:([^ -]+).*/\1/' \
              | cut -d'-' -f1 \
              || true
            )"

            if [ -n "$DETECTED_NODE" ]; then
              NODE_VERSION="$DETECTED_NODE"
            fi
          fi

          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Node major version: $NODE_VERSION"


      # ======================================================
      # GO / HYPERLEDGER CHAINCODE
      # ======================================================

      - name: Set up Go from chaincode/go.mod
        if: ${{ steps.repo.outputs.has_go == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: "chaincode/go.mod"
          cache: false

      - name: Verify Go environment
        if: ${{ steps.repo.outputs.has_go == 'true' }}
        run: |
          echo "========================================="
          echo "Go environment"
          echo "========================================="

          echo "Required:"
          grep '^go ' chaincode/go.mod

          echo
          echo "Installed:"
          go version

          echo
          echo "GOROOT:"
          go env GOROOT

          echo
          echo "GOPATH:"
          go env GOPATH

      - name: Download Go dependencies
        if: ${{ steps.repo.outputs.has_go == 'true' }}
        working-directory: ./chaincode
        run: |
          go mod download

      - name: Verify Go modules
        if: ${{ steps.repo.outputs.has_go == 'true' }}
        working-directory: ./chaincode
        run: |
          go mod verify

      - name: Run chaincode Go unit tests
        if: ${{ steps.repo.outputs.has_go == 'true' }}
        working-directory: ./chaincode
        run: |
          echo "========================================="
          echo "Running chaincode tests"
          echo "========================================="

          go test ./... -v -count=1


      # ======================================================
      # .NET / C# BACKEND
      # ======================================================

      - name: Set up .NET from global.json
        if: ${{ steps.repo.outputs.has_dotnet == 'true' && steps.repo.outputs.has_global_json == 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"

      # Fallback only if the branch somehow does not contain
      # global.json.
      - name: Set up fallback .NET 8
        if: ${{ steps.repo.outputs.has_dotnet == 'true' && steps.repo.outputs.has_global_json != 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Verify .NET environment
        if: ${{ steps.repo.outputs.has_dotnet == 'true' }}
        run: |
          echo "========================================="
          echo ".NET environment"
          echo "========================================="

          echo ".NET version:"
          dotnet --version

          echo
          echo "Installed SDKs:"
          dotnet --list-sdks

          echo
          echo "Installed runtimes:"
          dotnet --list-runtimes

          if [ -f "./global.json" ]; then
            echo
            echo "global.json:"
            cat ./global.json
          fi

          echo
          echo "Target frameworks:"

          find ./client-app \
            -type f \
            -name "*.csproj" \
            -print0 \
            | xargs -0 grep -H \
              -E "<TargetFramework>|<TargetFrameworks>" \
              || true

      - name: Restore and test C# backend
        if: ${{ steps.repo.outputs.has_dotnet == 'true' }}
        shell: bash
        run: |
          cd ./client-app

          echo "========================================="
          echo "Finding .NET solution/project"
          echo "========================================="

          SOLUTION="$(find . -type f -name "*.sln" -print -quit)"

          if [ -n "$SOLUTION" ]; then
            echo "Using solution:"
            echo "$SOLUTION"

            dotnet restore "$SOLUTION"

            dotnet build \
              "$SOLUTION" \
              --no-restore \
              --configuration Release

            dotnet test \
              "$SOLUTION" \
              --no-restore \
              --configuration Release \
              --verbosity normal

            exit 0
          fi


          PROJECTS="$(find . -type f -name "*.csproj")"

          if [ -z "$PROJECTS" ]; then
            echo "No .csproj files found."
            exit 0
          fi


          while IFS= read -r PROJECT; do
            [ -z "$PROJECT" ] && continue

            echo
            echo "========================================="
            echo "Project: $PROJECT"
            echo "========================================="

            dotnet restore "$PROJECT"

            dotnet build \
              "$PROJECT" \
              --no-restore \
              --configuration Release

            dotnet test \
              "$PROJECT" \
              --no-restore \
              --configuration Release \
              --verbosity normal

          done <<< "$PROJECTS"


      # ======================================================
      # NODE.JS
      # ======================================================

      - name: Set up Node.js
        if: ${{ steps.repo.outputs.has_node == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.repo.outputs.node_version }}"
          package-manager-cache: false

      - name: Verify Node environment
        if: ${{ steps.repo.outputs.has_node == 'true' }}
        run: |
          echo "========================================="
          echo "Node environment"
          echo "========================================="

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version


      # ======================================================
      # MIDDLEWARE
      # ======================================================

      - name: Install middleware dependencies
        if: ${{ steps.repo.outputs.has_node == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./middleware/package.json" ]; then
            echo "No middleware/package.json found."
            exit 0
          fi

          cd ./middleware

          if [ -f "package-lock.json" ]; then
            echo "Using npm ci"
            npm ci --no-audit
          else
            echo "WARNING: package-lock.json missing."
            echo "Falling back to npm install."
            npm install --no-audit
          fi

      - name: Validate middleware JavaScript
        if: ${{ steps.repo.outputs.has_node == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./middleware/middleware.js" ]; then
            echo "middleware.js not found."
            exit 1
          fi

          echo "Checking middleware.js syntax..."

          node --check ./middleware/middleware.js

      - name: Run middleware tests
        if: ${{ steps.repo.outputs.has_node == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./middleware/package.json" ]; then
            echo "No middleware package."
            exit 0
          fi

          cd ./middleware

          TEST_SCRIPT="$(
            node -p "require('./package.json').scripts?.test || ''"
          )"

          echo "Middleware test script:"
          echo "$TEST_SCRIPT"

          if [ -z "$TEST_SCRIPT" ]; then
            echo "No middleware unit test script configured."
            exit 0
          fi

          # Your current package.json contains:
          # echo "Error: no test specified" && exit 1
          #
          # That is npm's placeholder and should not falsely
          # fail the whole CI.
          if echo "$TEST_SCRIPT" | grep -qi "no test specified"; then
            echo "Placeholder npm test script detected."
            echo "Skipping middleware npm test."
            echo "JavaScript syntax validation already passed."
            exit 0
          fi

          npm test --silent


      # ======================================================
      # FRONTEND
      # ======================================================

      - name: Install frontend dependencies
        if: ${{ steps.repo.outputs.has_node == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./frontend/package.json" ]; then
            echo "No frontend/package.json found."
            exit 0
          fi

          cd ./frontend

          if [ -f "package-lock.json" ]; then
            echo "Using npm ci"
            npm ci --no-audit
          else
            echo "WARNING: package-lock.json missing."
            echo "Falling back to npm install."
            npm install --no-audit
          fi

      - name: Run frontend tests
        if: ${{ steps.repo.outputs.has_node == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./frontend/package.json" ]; then
            echo "No frontend package."
            exit 0
          fi

          cd ./frontend

          TEST_SCRIPT="$(
            node -p "require('./package.json').scripts?.test || ''"
          )"

          if [ -z "$TEST_SCRIPT" ]; then
            echo "No frontend test script configured."
            exit 0
          fi

          echo "Running frontend tests..."

          npm test -- \
            --watchAll=false \
            --passWithNoTests

      - name: Build frontend
        if: ${{ steps.repo.outputs.has_node == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./frontend/package.json" ]; then
            echo "No frontend package."
            exit 0
          fi

          cd ./frontend

          BUILD_SCRIPT="$(
            node -p "require('./package.json').scripts?.build || ''"
          )"

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "No frontend build script configured."
            exit 0
          fi

          echo "Building frontend..."

          DISABLE_ESLINT_PLUGIN=true \
          npm run build


      # ======================================================
      # FINAL UNIT TEST REPORT
      # ======================================================

      - name: Unit test runtime report
        if: always()
        run: |
          echo "========================================="
          echo "BLOCKGO UNIT TEST ENVIRONMENT"
          echo "========================================="

          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo
          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo
          echo "Go:"
          go version 2>/dev/null || echo "Not installed"

          echo
          echo ".NET:"
          dotnet --version 2>/dev/null || echo "Not installed"

          echo
          echo "Node:"
          node --version 2>/dev/null || echo "Not installed"

          echo
          echo "npm:"
          npm --version 2>/dev/null || echo "Not installed"

          echo
          echo "Docker:"
          docker --version 2>/dev/null || echo "Not available"

          echo "========================================="



  # ==========================================================
  # FULL STACK SMOKE TEST
  # ==========================================================

  full-stack-smoke:
    name: Full Stack Smoke Test

    needs:
      - unit-tests

    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_full_smoke == 'yes' }}

    timeout-minutes: 120

    env:
      CI: "true"

      NODE_VERSION: "20"

      POSTGRES_USER: postgres
      POSTGRES_PASS: ci-postgres-pass
      POSTGRES_DB: ActivityLogs
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

      JWT_SECRET: ci-test-jwt-secret-which-is-long
      INTERNAL_API_KEY: ci-internal-key

      BOOTSTRAP_REGISTRAR_PASS: admin123
      MOCK_REGISTRAR_PASS: admin123

      IPFS_ENCRYPTION_KEY: 01234567890123456789012345678901

      FABRIC_CA_INSECURE_TLS: "true"

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ======================================================
      # NODE FOR MIDDLEWARE
      # ======================================================

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Verify Node
        run: |
          node --version
          npm --version


      # ======================================================
      # SYSTEM REQUIREMENTS
      # ======================================================

      - name: Install system prerequisites
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            openssl

          echo "========================================="
          echo "Installed tools"
          echo "========================================="

          docker --version
          node --version
          npm --version
          curl --version | head -n 1
          jq --version
          openssl version


      # ======================================================
      # POSTGRESQL
      # ======================================================

      - name: Remove stale PostgreSQL container
        run: |
          docker rm -f blockgo-postgres 2>/dev/null || true

      - name: Start PostgreSQL
        run: |
          docker run \
            --name blockgo-postgres \
            --detach \
            --publish 5432:5432 \
            --env POSTGRES_USER="${POSTGRES_USER}" \
            --env POSTGRES_PASSWORD="${POSTGRES_PASS}" \
            --env POSTGRES_DB="${POSTGRES_DB}" \
            --health-cmd="pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" \
            --health-interval=2s \
            --health-timeout=5s \
            --health-retries=40 \
            postgres:13

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          echo "Waiting for PostgreSQL..."

          for i in {1..60}; do

            STATUS="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                blockgo-postgres \
                2>/dev/null \
                || echo "missing"
            )"

            echo "PostgreSQL attempt $i -> $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "PostgreSQL is healthy."

              docker exec \
                blockgo-postgres \
                postgres --version

              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "PostgreSQL reported unhealthy."

              docker logs blockgo-postgres || true

              exit 1
            fi

            sleep 2
          done

          echo "PostgreSQL startup timed out."

          docker ps -a || true
          docker logs blockgo-postgres || true

          exit 1


      # ======================================================
      # TEST CERTIFICATES
      # ======================================================

      - name: Prepare Fabric CA test certificates
        shell: bash
        run: |
          mkdir -p \
            network/fabric-ca/registrar \
            network/fabric-ca/faculty \
            network/fabric-ca/department

          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -keyout /tmp/ci-ca-key.pem \
            -out /tmp/ci-ca-cert.pem \
            -days 1 \
            -subj "/CN=blockgo-ci-ca"

          openssl x509 \
            -in /tmp/ci-ca-cert.pem \
            -noout \
            -subject \
            -dates

          cp \
            /tmp/ci-ca-cert.pem \
            network/fabric-ca/registrar/ca-cert.pem

          cp \
            /tmp/ci-ca-cert.pem \
            network/fabric-ca/faculty/ca-cert.pem

          cp \
            /tmp/ci-ca-cert.pem \
            network/fabric-ca/department/ca-cert.pem


      # ======================================================
      # NETWORK ENV
      # ======================================================

      - name: Prepare network environment
        shell: bash
        run: |
          cat > network/.env <<EOF
          NODE_ENV=test

          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASS=${POSTGRES_PASS}
          POSTGRES_PASSWORD=${POSTGRES_PASS}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_HOST=${POSTGRES_HOST}
          POSTGRES_PORT=${POSTGRES_PORT}

          JWT_SECRET=${JWT_SECRET}
          INTERNAL_API_KEY=${INTERNAL_API_KEY}

          BOOTSTRAP_REGISTRAR_PASS=${BOOTSTRAP_REGISTRAR_PASS}
          MOCK_REGISTRAR_PASS=${MOCK_REGISTRAR_PASS}

          IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}

          FABRIC_CA_REGISTRAR_CERT=${GITHUB_WORKSPACE}/network/fabric-ca/registrar/ca-cert.pem
          FABRIC_CA_FACULTY_CERT=${GITHUB_WORKSPACE}/network/fabric-ca/faculty/ca-cert.pem
          FABRIC_CA_DEPARTMENT_CERT=${GITHUB_WORKSPACE}/network/fabric-ca/department/ca-cert.pem

          FABRIC_CA_INSECURE_TLS=true
          EOF

          echo "network/.env created successfully."


      # ======================================================
      # MIDDLEWARE DEPENDENCIES
      # ======================================================

      - name: Verify middleware exists
        run: |
          if [ ! -f "./middleware/package.json" ]; then
            echo "ERROR: middleware/package.json not found."
            exit 1
          fi

          if [ ! -f "./middleware/middleware.js" ]; then
            echo "ERROR: middleware/middleware.js not found."
            exit 1
          fi

      - name: Install middleware dependencies
        working-directory: ./middleware
        shell: bash
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --no-audit
          else
            echo "WARNING: package-lock.json missing."
            npm install --no-audit
          fi

      - name: Validate middleware JavaScript
        working-directory: ./middleware
        run: |
          node --check middleware.js


      # ======================================================
      # START MIDDLEWARE
      # ======================================================

      - name: Start middleware
        working-directory: ./middleware

        env:
          NODE_ENV: test

          PORT: "4000"

          JWT_SECRET: ci-test-jwt-secret-which-is-long
          INTERNAL_API_KEY: ci-internal-key

          POSTGRES_USER: postgres
          POSTGRES_PASS: ci-postgres-pass
          POSTGRES_PASSWORD: ci-postgres-pass
          POSTGRES_DB: ActivityLogs
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"

          BOOTSTRAP_REGISTRAR_PASS: admin123
          MOCK_REGISTRAR_PASS: admin123

          IPFS_ENCRYPTION_KEY: 01234567890123456789012345678901

          FABRIC_CA_REGISTRAR_CERT: ${{ github.workspace }}/network/fabric-ca/registrar/ca-cert.pem
          FABRIC_CA_FACULTY_CERT: ${{ github.workspace }}/network/fabric-ca/faculty/ca-cert.pem
          FABRIC_CA_DEPARTMENT_CERT: ${{ github.workspace }}/network/fabric-ca/department/ca-cert.pem

          FABRIC_CA_INSECURE_TLS: "true"

        shell: bash
        run: |
          rm -f /tmp/middleware.log
          rm -f /tmp/middleware.pid

          nohup node middleware.js \
            > /tmp/middleware.log \
            2>&1 &

          MIDDLEWARE_PID=$!

          echo "$MIDDLEWARE_PID" > /tmp/middleware.pid

          echo "Middleware PID: $MIDDLEWARE_PID"

          sleep 3

          # Fail immediately if the process already died.
          if ! kill -0 "$MIDDLEWARE_PID" 2>/dev/null; then
            echo "Middleware exited immediately."

            echo "========================================="
            echo "MIDDLEWARE LOG"
            echo "========================================="

            cat /tmp/middleware.log || true

            exit 1
          fi

          echo "Middleware process is running."


      # ======================================================
      # HEALTH CHECK
      # ======================================================

      - name: Wait for middleware health
        shell: bash
        run: |
          URL="http://127.0.0.1:4000/api/health"

          echo "Checking:"
          echo "$URL"

          for i in {1..60}; do

            # Verify middleware process still exists.
            if [ -f /tmp/middleware.pid ]; then
              PID="$(cat /tmp/middleware.pid)"

              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Middleware process stopped."

                cat /tmp/middleware.log || true

                exit 1
              fi
            fi


            HTTP_CODE="$(
              curl \
                --silent \
                --output /tmp/health-response.txt \
                --write-out "%{http_code}" \
                --connect-timeout 3 \
                --max-time 5 \
                "$URL" \
                || true
            )"

            echo "Health attempt $i -> HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Middleware is healthy."

              echo
              echo "Health response:"
              cat /tmp/health-response.txt || true

              exit 0
            fi

            sleep 2
          done

          echo "Middleware health check timed out."

          echo
          echo "========================================="
          echo "MIDDLEWARE LOG"
          echo "========================================="

          cat /tmp/middleware.log || true

          echo
          echo "========================================="
          echo "POSTGRES LOG"
          echo "========================================="

          docker logs blockgo-postgres || true

          exit 1


      # ======================================================
      # API INTEGRATION TESTS
      # ======================================================

      - name: Verify API integration test script
        run: |
          if [ ! -f ".github/scripts/api-integration-tests.sh" ]; then
            echo "ERROR:"
            echo ".github/scripts/api-integration-tests.sh not found."

            exit 1
          fi

          bash -n .github/scripts/api-integration-tests.sh

      - name: Run API integration tests
        env:
          INTERNAL_API_KEY: ci-internal-key
          MOCK_REGISTRAR_PASS: admin123

        shell: bash
        run: |
          echo "========================================="
          echo "Running API integration tests"
          echo "========================================="

          if ! bash .github/scripts/api-integration-tests.sh; then

            echo
            echo "========================================="
            echo "API INTEGRATION TESTS FAILED"
            echo "========================================="

            echo
            echo "Middleware log:"
            cat /tmp/middleware.log || true

            echo
            echo "PostgreSQL log:"
            docker logs blockgo-postgres || true

            exit 1
          fi

          echo
          echo "API integration tests passed."


      # ======================================================
      # FINAL SMOKE REPORT
      # ======================================================

      - name: Smoke test environment report
        if: always()
        run: |
          echo "========================================="
          echo "BLOCKGO FULL STACK ENVIRONMENT"
          echo "========================================="

          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo
          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo
          echo "Node:"
          node --version 2>/dev/null || true

          echo
          echo "npm:"
          npm --version 2>/dev/null || true

          echo
          echo "Docker:"
          docker --version 2>/dev/null || true

          echo
          echo "PostgreSQL:"
          docker exec \
            blockgo-postgres \
            postgres --version \
            2>/dev/null || true

          echo
          echo "Containers:"
          docker ps -a || true


      # ======================================================
      # CLEANUP
      # ======================================================

      - name: Tear down test environment
        if: always()
        shell: bash
        run: |
          echo "========================================="
          echo "Cleaning CI environment"
          echo "========================================="

          if [ -f /tmp/middleware.pid ]; then
            PID="$(cat /tmp/middleware.pid)"

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping middleware PID $PID"
              kill "$PID" || true
            fi
          fi

          docker rm -f blockgo-postgres 2>/dev/null || true

          echo
          echo "========================================="
          echo "FINAL MIDDLEWARE LOG"
          echo "========================================="

          if [ -f /tmp/middleware.log ]; then
            cat /tmp/middleware.log
          else
            echo "No middleware log created."
          fi
