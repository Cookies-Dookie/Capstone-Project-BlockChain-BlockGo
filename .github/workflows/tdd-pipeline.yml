name: Backup-2 TDD Pipeline

on:
  push:
    branches: [Backup-2]
  pull_request:
    branches: [Backup-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-2-tdd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-deployment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout Backup-2 source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            middleware/package-lock.json

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Go from chaincode module
        uses: actions/setup-go@v5
        with:
          go-version-file: chaincode/go.mod
          cache-dependency-path: chaincode/go.sum

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Test middleware microservices
        working-directory: middleware
        run: |
          npm ci --no-audit
          npm test

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit
          npm test -- --watchAll=false
          npm run build

      - name: Build ASP.NET backend
        run: |
          dotnet restore client-app/For_Testing_Only_Capstone.csproj
          dotnet build client-app/For_Testing_Only_Capstone.csproj --configuration Release --no-restore

      - name: Test chaincode
        working-directory: chaincode
        run: go test ./...

      - name: Verify deployment source
        run: |
          bash -n network/k8s/deploy-k8s.sh
          bash network/k8s/deploy-k8s.sh local verify

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f monitoring/observability-stack.yaml >/dev/null
          kubectl apply --dry-run=client -f network/k8s/04a-postgres-configmap.yaml >/dev/null
          kubectl apply --dry-run=client -f network/k8s/07-peer-registrar.yaml >/dev/null
          kubectl apply --dry-run=client -f network/k8s/07-peer-faculty.yaml >/dev/null
          kubectl apply --dry-run=client -f network/k8s/07-peer-department.yaml >/dev/null

      - name: Verify multi-session deployment contract
        run: |
          grep -q "sessionStorage" frontend/src/services/authSession.js
          grep -q "'/registrar'" frontend/src/services/authSession.js
          grep -q "'/department-admin'" frontend/src/services/authSession.js
          grep -q "'/faculty'" frontend/src/services/authSession.js
          grep -q "'/student'" frontend/src/services/authSession.js
          grep -q "try_files.*index.html" network/k8s/12-frontend-ha.yaml
          grep -q "path: /" network/k8s/15-main-ingress.yaml
