---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: plv-fabric
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: blockgo
        environment: production
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
    - job_name: 'fabric-orderer'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - plv-main-campus
          - plv-annex-campus
          - plv-pubad-campus
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: orderer-.*
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8443"
    - job_name: 'fabric-peer'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - plv-main-campus
          - plv-annex-campus
          - plv-pubad-campus
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: peer-.*
    - job_name: 'middleware-api'
      metrics_path: /metrics
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - plv-fabric
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: middleware-api
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: api
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
    - job_name: 'kube-state-metrics'
      static_configs:
      - targets:
        - kube-state-metrics.kube-system.svc.cluster.local:8080
    - job_name: 'kubernetes-nodes-cadvisor'
      scheme: https
      metrics_path: /metrics/cadvisor
      kubernetes_sd_configs:
      - role: node
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  alert-rules.yml: |
    groups:
    - name: blockgo-middleware
      interval: 30s
      rules:
      - alert: MiddlewareAPIMemoryUsageHigh
        expr: |
          container_memory_working_set_bytes{namespace="plv-fabric",pod=~"middleware-api.*",container="middleware"}
          / container_spec_memory_limit_bytes{namespace="plv-fabric",pod=~"middleware-api.*",container="middleware"} > 0.9
        for: 2m
        labels:
          severity: critical
          component: middleware-api
        annotations:
          summary: "Middleware API pod {{ $labels.pod }} memory usage is above 90%"
          description: "The middleware container is close to its memory limit. Check /metrics, pod logs, and heap snapshots if DEBUG_TOKEN is enabled."
      - alert: MiddlewareAPIMemoryGrowth
        expr: |
          increase(container_memory_working_set_bytes{namespace="plv-fabric",pod=~"middleware-api.*",container="middleware"}[1h]) > 52428800
        for: 10m
        labels:
          severity: warning
          component: middleware-api
        annotations:
          summary: "Middleware API pod {{ $labels.pod }} memory grew by more than 50MiB in 1h"
          description: "Sustained memory growth can indicate retained Fabric gateways, request buffers, or other leaked objects."
      - alert: MiddlewareGatewayCacheNearCapacity
        expr: |
          blockgo_gateway_cache_entries{job="middleware-api"} / blockgo_gateway_cache_max_entries{job="middleware-api"} > 0.8
        for: 5m
        labels:
          severity: warning
          component: middleware-api
        annotations:
          summary: "Middleware gateway cache is above 80% capacity"
          description: "The Fabric gateway cache is nearing its configured maximum. Verify user traffic and eviction logs."
      - alert: MiddlewareAPIPodRestarting
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="plv-fabric",pod=~"middleware-api.*",container="middleware"}[15m]) > 1
        for: 5m
        labels:
          severity: critical
          component: middleware-api
        annotations:
          summary: "Middleware API pod {{ $labels.pod }} restarted repeatedly"
          description: "Check previous container logs and pod events for OOMKilled, failed probes, or startup errors."
      - alert: MiddlewareAPIHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le, pod) (rate(http_request_duration_seconds_bucket{job="middleware-api"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
          component: middleware-api
        annotations:
          summary: "Middleware API p95 latency is above 1s"
          description: "High latency may come from PostgreSQL, Fabric gateway calls, or memory pressure."
      - alert: MiddlewareAPIDown
        expr: |
          up{job="middleware-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: middleware-api
        annotations:
          summary: "Middleware API target {{ $labels.pod }} is down"
          description: "Prometheus cannot scrape middleware metrics. Check pod readiness and service discovery."
    - name: blockgo-platform
      interval: 30s
      rules:
      - alert: FrontendDeploymentUnavailable
        expr: |
          kube_deployment_status_replicas_available{namespace="plv-fabric",deployment="frontend"} < 1
        for: 2m
        labels:
          severity: critical
          component: frontend
        annotations:
          summary: "Frontend deployment has no available replicas"
          description: "The React/Nginx frontend is unavailable. Check frontend pod readiness, /nginx-health, and ingress events."
      - alert: ClientAppDeploymentUnavailable
        expr: |
          kube_deployment_status_replicas_available{namespace="plv-fabric",deployment="client-app"} < 1
        for: 2m
        labels:
          severity: critical
          component: client-app
        annotations:
          summary: "C# backend deployment has no available replicas"
          description: "The client-app backend is unavailable. Check /api/backend/health, pod logs, database connectivity, and readiness events."
      - alert: PlatformPodRestarting
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="plv-fabric",pod=~"(frontend|client-app).*",container=~"frontend-nginx|client-app"}[15m]) > 1
        for: 5m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: "Platform pod {{ $labels.pod }} restarted repeatedly"
          description: "A frontend or C# backend container restarted more than once in 15 minutes. Check previous logs and pod events."
      - alert: FrontendMemoryUsageHigh
        expr: |
          container_memory_working_set_bytes{namespace="plv-fabric",pod=~"frontend.*",container="frontend-nginx"}
          / container_spec_memory_limit_bytes{namespace="plv-fabric",pod=~"frontend.*",container="frontend-nginx"} > 0.85
        for: 5m
        labels:
          severity: warning
          component: frontend
        annotations:
          summary: "Frontend pod {{ $labels.pod }} memory usage is above 85%"
          description: "The frontend Nginx container is close to its memory limit. Check traffic, static asset serving, and pod events."
      - alert: ClientAppMemoryUsageHigh
        expr: |
          container_memory_working_set_bytes{namespace="plv-fabric",pod=~"client-app.*",container="client-app"}
          / container_spec_memory_limit_bytes{namespace="plv-fabric",pod=~"client-app.*",container="client-app"} > 0.85
        for: 5m
        labels:
          severity: warning
          component: client-app
        annotations:
          summary: "C# backend pod {{ $labels.pod }} memory usage is above 85%"
          description: "The client-app container is close to its memory limit. Check request volume, logs, and database/IPFS operations."
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: middleware-api-pdb
  namespace: plv-fabric
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: middleware-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orderer-pdb
  namespace: plv-main-campus
spec:
  minAvailable: 1
  selector:
    matchLabels:
      org: orderer
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: plv-fabric-quota
  namespace: plv-fabric
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    pods: "50"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: plv-main-campus-quota
  namespace: plv-main-campus
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "30"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: plv-fabric-limits
  namespace: plv-fabric
spec:
  limits:
  - max:
      cpu: "2"
      memory: "2Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    default:
      cpu: "250m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
  - max:
      cpu: "4"
      memory: "4Gi"
    type: Pod
---
apiVersion: v1
kind: LimitRange
metadata:
  name: plv-main-campus-limits
  namespace: plv-main-campus
spec:
  limits:
  - max:
      cpu: "4"
      memory: "4Gi"
    default:
      cpu: "250m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: plv-annex-campus-limits
  namespace: plv-annex-campus
spec:
  limits:
  - default:
      cpu: "250m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: plv-pubad-campus-limits
  namespace: plv-pubad-campus
spec:
  limits:
  - default:
      cpu: "250m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
