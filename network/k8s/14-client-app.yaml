apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-app
  namespace: plv-fabric
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: client-app
  template:
    metadata:
      labels:
        app: client-app
    spec:
      containers:
      - name: client-app
        image: registry.example.com/plv-repo/client-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        startupProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        envFrom:
        - secretRef:
            name: blockgo-secrets
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5000"
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: JWT_SECRET
        - name: Jwt__Secret
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: JWT_SECRET
        - name: JwtSettings__Key
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: JWT_SECRET
        - name: JwtSettings__Secret
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: JWT_SECRET
        - name: IpfsEncryptionKey
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: IPFS_ENCRYPTION_KEY
        - name: VaultPassword
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: VAULT_PASSWORD
        - name: MIDDLEWARE_URL
          value: "http://middleware-api.plv-fabric.svc.cluster.local:4000"
        - name: Middleware__Url
          value: "http://middleware-api.plv-fabric.svc.cluster.local:4000"
        - name: MiddlewareUrl
          value: "http://middleware-api.plv-fabric.svc.cluster.local:4000"
        - name: MiddlewareApiUrl
          value: "http://middleware-api.plv-fabric.svc.cluster.local:4000"
        - name: Monitoring__FrontendUrl
          value: "http://frontend-service.plv-fabric.svc.cluster.local"
        - name: Monitoring__MiddlewareUrl
          value: "http://middleware-api.plv-fabric.svc.cluster.local:4000"
        - name: Monitoring__PrometheusUrl
          value: "http://prometheus.plv-fabric.svc.cluster.local:9090"
        - name: PROMETHEUS_URL
          value: "http://prometheus.plv-fabric.svc.cluster.local:9090"
        - name: Monitoring__GrafanaUrl
          value: "http://grafana.plv-fabric.svc.cluster.local:3000"
        - name: GRAFANA_URL
          value: "http://grafana.plv-fabric.svc.cluster.local:3000"
        - name: InternalApiKey
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: INTERNAL_API_KEY
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: INTERNAL_API_KEY
        - name: IPFS_HOST
          value: "ipfs-ha-gateway.plv-fabric.svc.cluster.local"
        - name: IpfsApiUrl
          value: "http://ipfs-ha-api.plv-fabric.svc.cluster.local:5001/api/v0/add?cid-version=1&wrap-with-directory=false"
        - name: IpfsUrl
          value: "http://ipfs-ha-api.plv-fabric.svc.cluster.local:5001"
        - name: IpfsGatewayUrl
          value: "http://ipfs-ha-gateway.plv-fabric.svc.cluster.local:8080"
        - name: IPFS_PEER_NODES
          value: "ipfs-api.plv-fabric.svc.cluster.local,ipfs-annex-api.plv-annex-campus.svc.cluster.local,ipfs-pubad-api.plv-pubad-campus.svc.cluster.local"
        - name: POSTGRES_DB
          value: "ActivityLogs"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASS
          valueFrom:
            secretKeyRef:
              name: blockgo-secrets
              key: POSTGRES_PASS
        - name: ConnectionStrings__MasterConnection
          value: "Host=postgres.plv-main-campus.svc.cluster.local;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASS)"
        - name: ConnectionStrings__ReplicaConnection
          value: "Host=postgres.plv-main-campus.svc.cluster.local;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASS)"
        - name: ConnectionStrings__PostgresConnection
          value: "Host=postgres.plv-main-campus.svc.cluster.local;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASS)"
        - name: REDIS_CONNECTION_STRING
          value: "redis-master.plv-fabric.svc.cluster.local:6379"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: client-app-service
  namespace: plv-fabric
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: client-app
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
