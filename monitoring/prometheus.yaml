global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: blockgo
    environment: production

rule_files:
  - alert-rules.yaml

scrape_configs:
  - job_name: middleware-api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - plv-fabric
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: middleware-api
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: api
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  - job_name: middleware-services
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - plv-fabric
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: auth-service|fabric-identity-service|ledger-service|grade-upload-service|settings-service
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: api
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  - job_name: kubernetes-nodes-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    kubernetes_sd_configs:
      - role: node
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics.kube-system.svc.cluster.local:8080

  - job_name: fabric-orderer
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - plv-main-campus
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: orderer
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8443"

  - job_name: fabric-peer
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - plv-main-campus
            - plv-annex-campus
            - plv-pubad-campus
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: peer-.*
